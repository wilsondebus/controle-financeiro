<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Novo gasto | Finance</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div class="layout">

    <div th:replace="~{fragments/menu :: menu}"></div>

    <main class="content narrow">

        <div class="page-header">

            <div>
                <p class="eyebrow">
                    Movimentações
                </p>

                <h1 th:text="${gasto.id == null ? 'Novo gasto' : 'Editar gasto'}">
                    Novo gasto
                </h1>
            </div>

            <a class="btn btn-secondary"
               th:href="@{/gastos}">
                Voltar
            </a>

        </div>


        <form class="form-card"
              th:action="@{/gastos/salvar}"
              th:object="${gasto}"
              method="post">

            <input type="hidden"
                   th:field="*{id}">


            <div class="form-grid">

                <!-- DESCRIÇÃO -->

                <div class="field field-full">

                    <label for="descricao">
                        Descrição
                    </label>

                    <input id="descricao"
                           type="text"
                           th:field="*{descricao}"
                           placeholder="Ex.: Mercado, Uber, monitor..."
                           required>

                </div>


                <!-- VALOR -->

                <div class="field">

                    <label for="valor">
                        Valor
                    </label>

                    <input id="valor"
                           type="number"
                           th:field="*{valor}"
                           min="0"
                           step="0.01"
                           required>

                </div>


                <!-- DATA -->

                <div class="field">

                    <label for="data">
                        Data
                    </label>

                    <input id="data"
                           type="date"
                           th:field="*{data}"
                           required>

                </div>


                <!-- CATEGORIA -->

                <div class="field">

                    <label for="categoria">
                        Categoria
                    </label>

                    <select id="categoria"
                            th:field="*{categoriaId}"
                            required>

                        <option value="">
                            Selecione
                        </option>

                        <option th:each="categoria : ${categorias}"
                                th:value="${categoria.id}"
                                th:text="${categoria.nome}">
                        </option>

                    </select>

                </div>


                <!-- FORMA DE PAGAMENTO -->

                <div class="field">

                    <label for="formaPagamento">
                        Forma de pagamento
                    </label>

                    <select id="formaPagamento"
                            th:field="*{formaPagamentoId}"
                            required>

                        <option value="">
                            Selecione
                        </option>

                        <option th:each="forma : ${formasPagamento}"
                                th:value="${forma.id}"
                                th:text="${forma.nome}"
                                th:attr="data-tipo=${forma.tipo}">
                        </option>

                    </select>

                </div>


                <!-- CARTÃO -->

                <div class="field field-full"
                     id="campoCartao">

                    <label for="cartao">
                        Cartão
                    </label>

                    <select id="cartao"
                            th:field="*{cartaoId}">

                        <option value="">
                            Selecione o cartão
                        </option>

                        <option th:each="cartao : ${cartoes}"
                                th:value="${cartao.id}"
                                th:text="|${cartao.nome} - ${cartao.banco}|">
                        </option>

                    </select>

                    <small>
                        O cartão é usado para calcular o fechamento
                        e o vencimento da fatura.
                    </small>

                </div>


                <!-- PARCELADO -->

                <div class="field checkbox-field">

                    <label>

                        <input id="parcelado"
                               type="checkbox"
                               th:field="*{parcelado}">

                        Compra parcelada

                    </label>

                </div>


                <!-- QUANTIDADE DE PARCELAS -->

                <div class="field"
                     id="campoParcelas">

                    <label for="quantidadeParcelas">
                        Quantidade de parcelas
                    </label>

                    <input id="quantidadeParcelas"
                           type="number"
                           th:field="*{quantidadeParcelas}"
                           min="1"
                           max="120">

                </div>


                <!-- JUROS -->

                <div class="field checkbox-field">

                    <label>

                        <input id="possuiJuros"
                               type="checkbox"
                               th:field="*{possuiJuros}">

                        Possui juros

                    </label>

                </div>


                <!-- VALOR COM JUROS -->

                <div class="field"
                     id="campoJuros">

                    <label for="valorTotalComJuros">
                        Valor total com juros
                    </label>

                    <input id="valorTotalComJuros"
                           type="number"
                           th:field="*{valorTotalComJuros}"
                           min="0"
                           step="0.01">

                </div>


                <!-- OBSERVAÇÃO -->

                <div class="field field-full">

                    <label for="observacao">
                        Observação
                    </label>

                    <textarea id="observacao"
                              th:field="*{observacao}"
                              rows="4"
                              placeholder="Opcional"></textarea>

                </div>

            </div>


            <div class="form-actions">

                <a class="btn btn-secondary"
                   th:href="@{/gastos}">
                    Cancelar
                </a>

                <button class="btn btn-primary"
                        type="submit">
                    Salvar gasto
                </button>

            </div>

        </form>

    </main>

</div>


<script>

    const formaPagamento =
        document.getElementById("formaPagamento");

    const campoCartao =
        document.getElementById("campoCartao");

    const parcelado =
        document.getElementById("parcelado");

    const campoParcelas =
        document.getElementById("campoParcelas");

    const possuiJuros =
        document.getElementById("possuiJuros");

    const campoJuros =
        document.getElementById("campoJuros");


    function atualizarCampoCartao() {

        const opcao =
            formaPagamento.options[
                formaPagamento.selectedIndex
            ];

        const tipo =
            opcao
                ? opcao.getAttribute("data-tipo")
                : null;

        if (tipo === "CREDITO") {

            campoCartao.style.display = "flex";

        } else {

            campoCartao.style.display = "none";

        }
    }


    function atualizarCampoParcelas() {

        if (parcelado.checked) {

            campoParcelas.style.display = "flex";

        } else {

            campoParcelas.style.display = "none";

        }
    }


    function atualizarCampoJuros() {

        if (possuiJuros.checked) {

            campoJuros.style.display = "flex";

        } else {

            campoJuros.style.display = "none";

        }
    }


    formaPagamento.addEventListener(
        "change",
        atualizarCampoCartao
    );

    parcelado.addEventListener(
        "change",
        atualizarCampoParcelas
    );

    possuiJuros.addEventListener(
        "change",
        atualizarCampoJuros
    );


    atualizarCampoCartao();
    atualizarCampoParcelas();
    atualizarCampoJuros();

</script>

</body>
</html>
