<!DOCTYPE html>

<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Novo gasto | Finance
    </title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="layout">

    <!-- MENU -->

    <div th:replace="~{fragments/menu :: menu}">
    </div>


    <!-- CONTEÚDO -->

    <main class="content narrow">


        <!-- CABEÇALHO -->

        <div class="page-header">

            <div>

                <p class="eyebrow">
                    Movimentações
                </p>

                <h1
                        th:text="${gasto.id == null
                        ? 'Novo gasto'
                        : 'Editar gasto'}">

                    Novo gasto

                </h1>

            </div>


            <a
                    class="btn btn-secondary"
                    th:href="@{/gastos}">

                Voltar

            </a>

        </div>


        <!-- FORMULÁRIO -->

        <form
                class="form-card"
                th:action="@{/gastos/salvar}"
                th:object="${gasto}"
                method="post">


            <!-- ID -->

            <input
                    type="hidden"
                    th:field="*{id}">


            <div class="form-grid">


                <!-- DESCRIÇÃO -->

                <div class="field field-full">

                    <label for="descricao">
                        Descrição
                    </label>

                    <input
                            id="descricao"
                            type="text"
                            th:field="*{descricao}"
                            placeholder="Ex.: Mercado, combustível, notebook..."
                            required>

                </div>


                <!-- VALOR -->

                <div class="field">

                    <label for="valor">
                        Valor
                    </label>

                    <input
                            id="valor"
                            type="number"
                            th:field="*{valor}"
                            min="0"
                            step="0.01"
                            placeholder="Ex.: 150.00"
                            required>

                </div>


                <!-- DATA -->

                <div class="field">

                    <label for="data">
                        Data da compra
                    </label>

                    <input
                            id="data"
                            type="date"
                            th:field="*{data}"
                            required>

                </div>


                <!-- CATEGORIA -->

                <div class="field field-full">

                    <label for="categoria">
                        Categoria
                    </label>

                    <select
                            id="categoria"
                            th:field="*{categoriaId}"
                            required>


                        <option value="">
                            Selecione uma categoria
                        </option>


                        <option
                                th:each="categoria : ${categorias}"
                                th:value="${categoria.id}"
                                th:text="${categoria.nome}">
                        </option>


                    </select>

                </div>


                <!-- FORMA DE PAGAMENTO -->

                <div class="field field-full">

                    <label for="seletorPagamento">
                        Forma de pagamento
                    </label>


                    <select
                            id="seletorPagamento"
                            required>


                        <option value="">
                            Selecione
                        </option>


                        <!-- FORMAS NORMAIS -->

                        <optgroup label="Outras formas">


                            <option
                                    th:each="forma : ${formasPagamento}"
                                    th:if="${forma.tipo.name() != 'CREDITO'}"
                                    th:value="'FORMA_' + ${forma.id}"
                                    th:text="${forma.nome}">

                            </option>


                        </optgroup>


                        <!-- CARTÕES -->

                        <optgroup
                                label="Cartões de crédito"
                                th:if="${!#lists.isEmpty(cartoes)}">


                            <option
                                    th:each="cartao : ${cartoes}"
                                    th:value="'CARTAO_' + ${cartao.id}"
                                    th:text="${cartao.nome + ' - ' + cartao.banco}">

                            </option>


                        </optgroup>


                    </select>


                    <small>
                        Escolha uma forma comum ou diretamente um dos cartões cadastrados.
                    </small>


                    <!-- CAMPOS ESCONDIDOS -->

                    <input
                            type="hidden"
                            id="formaPagamentoId"
                            th:field="*{formaPagamentoId}">


                    <input
                            type="hidden"
                            id="cartaoId"
                            th:field="*{cartaoId}">


                </div>


                <!-- PARCELADO -->

                <div class="field checkbox-field">

                    <label>

                        <input
                                id="parcelado"
                                type="checkbox"
                                th:field="*{parcelado}">

                        Compra parcelada

                    </label>

                </div>


                <!-- QUANTIDADE DE PARCELAS -->

                <div
                        class="field"
                        id="campoParcelas">

                    <label for="quantidadeParcelas">
                        Quantidade de parcelas
                    </label>

                    <input
                            id="quantidadeParcelas"
                            type="number"
                            th:field="*{quantidadeParcelas}"
                            min="1"
                            max="120">

                </div>


                <!-- JUROS -->

                <div class="field checkbox-field">

                    <label>

                        <input
                                id="possuiJuros"
                                type="checkbox"
                                th:field="*{possuiJuros}">

                        Possui juros

                    </label>

                </div>


                <!-- VALOR COM JUROS -->

                <div
                        class="field"
                        id="campoJuros">

                    <label for="valorTotalComJuros">
                        Valor total com juros
                    </label>

                    <input
                            id="valorTotalComJuros"
                            type="number"
                            th:field="*{valorTotalComJuros}"
                            min="0"
                            step="0.01"
                            placeholder="Ex.: 1200.00">

                </div>


                <!-- OBSERVAÇÃO -->

                <div class="field field-full">

                    <label for="observacao">
                        Observação
                    </label>

                    <textarea
                            id="observacao"
                            th:field="*{observacao}"
                            rows="4"
                            placeholder="Opcional"></textarea>

                </div>


            </div>


            <!-- AÇÕES -->

            <div class="form-actions">

                <a
                        class="btn btn-secondary"
                        th:href="@{/gastos}">

                    Cancelar

                </a>


                <button
                        class="btn btn-primary"
                        type="submit">

                    Salvar gasto

                </button>

            </div>


        </form>


    </main>

</div>


<script>

    const seletorPagamento =
        document.getElementById(
            "seletorPagamento"
        );


    const formaPagamentoId =
        document.getElementById(
            "formaPagamentoId"
        );


    const cartaoId =
        document.getElementById(
            "cartaoId"
        );


    const parcelado =
        document.getElementById(
            "parcelado"
        );


    const campoParcelas =
        document.getElementById(
            "campoParcelas"
        );


    const possuiJuros =
        document.getElementById(
            "possuiJuros"
        );


    const campoJuros =
        document.getElementById(
            "campoJuros"
        );


    /*
     * Atualiza os campos escondidos
     * conforme a opção escolhida.
     */

    function atualizarPagamento() {

        const valor =
            seletorPagamento.value;


        formaPagamentoId.value = "";

        cartaoId.value = "";


        /*
         * Forma comum
         */

        if (
            valor.startsWith("FORMA_")
        ) {

            formaPagamentoId.value =
                valor.replace(
                    "FORMA_",
                    ""
                );
        }


        /*
         * Cartão
         */

        if (
            valor.startsWith("CARTAO_")
        ) {

            cartaoId.value =
                valor.replace(
                    "CARTAO_",
                    ""
                );
        }

    }


    /*
     * Exibe ou esconde
     * quantidade de parcelas.
     */

    function atualizarCampoParcelas() {

        campoParcelas.style.display =
            parcelado.checked
                ? "flex"
                : "none";

    }


    /*
     * Exibe ou esconde
     * valor total com juros.
     */

    function atualizarCampoJuros() {

        campoJuros.style.display =
            possuiJuros.checked
                ? "flex"
                : "none";

    }


    /*
     * Quando alterar pagamento.
     */

    seletorPagamento.addEventListener(
        "change",
        atualizarPagamento
    );


    /*
     * Quando alterar parcelamento.
     */

    parcelado.addEventListener(
        "change",
        atualizarCampoParcelas
    );


    /*
     * Quando alterar juros.
     */

    possuiJuros.addEventListener(
        "change",
        atualizarCampoJuros
    );


    /*
     * Estado inicial da tela.
     */

    atualizarCampoParcelas();

    atualizarCampoJuros();


    /*
     * Quando estiver editando um gasto,
     * tenta selecionar automaticamente
     * o pagamento já salvo.
     */

    const valorFormaAtual =
        formaPagamentoId.value;


    const valorCartaoAtual =
        cartaoId.value;


    if (
        valorCartaoAtual
        && valorCartaoAtual !== ""
    ) {

        seletorPagamento.value =
            "CARTAO_"
            + valorCartaoAtual;

    }

    else if (
        valorFormaAtual
        && valorFormaAtual !== ""
    ) {

        seletorPagamento.value =
            "FORMA_"
            + valorFormaAtual;

    }


</script>


</body>

</html>
